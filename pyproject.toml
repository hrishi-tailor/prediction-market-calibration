[project]
name = "pmcal"
version = "0.1.0"
description = "Are prediction markets calibrated? An empirical study of Kalshi and Polymarket."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hrishi Tailor" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.scripts]
pmcal = "pmcal.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
    "ruff>=0.5",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmcal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
# statsmodels, scipy and duckdb ship no type stubs.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
